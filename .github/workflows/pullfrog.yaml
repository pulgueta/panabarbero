name: Pullfrog

run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

# One agent run per ref: overlapping runs would review the same code twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Pullfrog authenticates via GitHub OIDC.
      contents: read # Checkout only; the agent never pushes.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/setup

      - name: Run Pullfrog agent
        uses: pullfrog/pullfrog@ae4145b3d72b3f4aa045e2352dc6b2c7538daeeb # v0.1.101
        with:
          prompt: ${{ inputs.prompt }}