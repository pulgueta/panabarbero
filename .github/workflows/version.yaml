name: Version apps

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version_apps: [apps/api, apps/mobile, apps/web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/setup

      - name: Generate semantic release version
        working-directory: ${{ matrix.version_apps }}
        run: bunx semantic-release
