packages:
  - apps/*
  - packages/*

catalog:
  convex: "1.48.0"
  zod: "4.6.7"
  react: "19.2.9"
  react-dom: "19.2.9"
  typescript: "7.0.2"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.7"
  date-fns: "4.4.0"
  "@date-fns/tz": "^1.5.0"

overrides:
  # @convex-dev/polar 0.9.2 imports `@polar-sh/sdk/core.js` and `/webhooks`, which
  # the auto-installed 1.x peer no longer exports.
  "@polar-sh/sdk": "0.49.0"

allowBuilds:
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true
